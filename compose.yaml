services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chess_engine}
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ stores data under /var/lib/postgresql (subdir), not .../data.
      # Mount the parent so the image's layout/upgrade path is preserved.
      - pgdata:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chess_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      database_url: postgresql+psycopg://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-chess_engine}
      secret_key: ${SECRET_KEY:?set SECRET_KEY in .env}
      cookie_secure: ${COOKIE_SECURE:-true}
      cors_origins: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      stockfish_path: ${STOCKFISH_PATH:-}
      # Hosted Stockfish fallback (used only when no binary resolves).
      stockfish_api_key: ${STOCKFISH_API_KEY:-}
      stockfish_api_base_url: ${STOCKFISH_API_BASE_URL:-https://stockfishapi.com/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Auth extras: Google sign-in + password-reset email. Empty = feature
      # off (Google button hidden; reset link logged instead of emailed).
      google_client_id: ${GOOGLE_CLIENT_ID:-}
      reset_link_base: ${RESET_LINK_BASE:-http://localhost:${WEB_PORT:-5173}}
      smtp_host: ${SMTP_HOST:-}
      smtp_port: ${SMTP_PORT:-587}
      smtp_username: ${SMTP_USERNAME:-}
      smtp_password: ${SMTP_PASSWORD:-}
      smtp_from: ${SMTP_FROM:-}
      # ElevenLabs TTS proxy (empty key = browser speechSynthesis fallback).
      elevenlabs_api_key: ${ELEVENLABS_API_KEY:-}
      elevenlabs_voice_id: ${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}
      elevenlabs_model_id: ${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
    ports:
      - "${API_PORT:-8000}:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size 4096"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at image build time (Vite static env).
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  # Lightweight web DB admin (Adminer) — convenience UI only; not for prod.
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8090}:8080"

volumes:
  pgdata:
