# Development-only overrides (local dev).
#
# Usage:  docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Adds the Stockfish binary (installed from distro packages in the dev image) so
# engine moves and benchmarks work locally. The production compose file is unchanged
# and stays binary-free (GPL-3.0, REL-011).
#
# Note: compose merges `services` by name; only keys set here are overridden.
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      # compose replaces the whole `environment` map here, so every value the API
      # needs must be repeated — keeping the db/secret lines is what stops a
      # `--dev` override from silently blanking the development database URL.
      database_url: postgresql+psycopg://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-chess_engine}
      secret_key: ${SECRET_KEY:?set SECRET_KEY in .env}
      # Debian/Ubuntu place the stockfish binary here, which is NOT on PATH.
      # Uses explicit $VAR form so it is read from .env; set STOCKFISH_PATH in
      # .env to override (e.g. a locally-built binary).
      stockfish_path: ${STOCKFISH_PATH:-/usr/games/stockfish}
      stockfish_api_key: ${STOCKFISH_API_KEY:-}
      stockfish_api_base_url: ${STOCKFISH_API_BASE_URL:-https://stockfishapi.com/v1}
      elevenlabs_api_key: ${ELEVENLABS_API_KEY:-}
      elevenlabs_voice_id: ${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}
      elevenlabs_model_id: ${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
