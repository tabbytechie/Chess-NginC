# Reverse-proxy snippet for the web bundle (REL-003: TLS terminates here).
# The API lives behind the same host; cookies stay first-party (REL-012).
server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when a certificate is configured.
    # Uncomment after provisioning certs (REL-003):
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # The API lives behind the same host (REL-012): first-party cookies flow
        # through the proxy, so the browser sees a single origin.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers for the static bundle.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
