# Reverse-proxy snippet for the web bundle (REL-003: TLS terminates here).
# The API lives behind the same host; cookies stay first-party (REL-012).
server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when a certificate is configured.
    # Uncomment after provisioning certs (REL-003):
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # SPA entry point. Without an explicit policy nginx sends no Cache-Control
    # for index.html, so browsers apply *heuristic* caching and keep serving a
    # stale shell that points at the previous build's hashed bundles. That is why
    # a fixed web image (e.g. the Adam narration default) can appear to have no
    # effect until a hard refresh. `expires -1` emits `Cache-Control: no-cache`,
    # forcing a revalidate (304 when unchanged) on every navigation so a rebuilt
    # image is picked up immediately. The `expires` directive is used instead of
    # `add_header` so the server-level security headers below stay inherited
    # (nginx drops inherited add_headers as soon as a block declares its own).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed build assets are safe to cache forever: any code change
    # yields a new filename, so a stale bundle can never be served under a name
    # the new index.html still references. `expires max` sets a 10-year lifetime.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location /api/ {
        # The API lives behind the same host (REL-012): first-party cookies flow
        # through the proxy, so the browser sees a single origin.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Online-play WebSocket (online-plan §6). WS needs the HTTP/1.1 Upgrade
    # handshake; the blanket `Connection ""` above would strip it, so this
    # path gets its own location. `Upgrade $http_upgrade` forwards the header
    # unchanged, and Origin is passed through for the server-side CSWSRF
    # allowlist check. Timeouts cover a long idle think turn plus the 25s
    # client heartbeat (a 60s default would drop live boards).
    location /api/v1/online/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Security headers for the static bundle.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
