# Reverse-proxy snippet for the web bundle (REL-003: TLS terminates upstream).
# The API lives behind the same host; cookies stay first-party (REL-012).
# Served by nginx-unprivileged, so it listens on the non-privileged 8080.
server {
    listen 8080;
    server_name _;

    # Redirect to HTTPS once a certificate is provisioned at the edge (REL-003):
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Phase 5 hardening).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # framer-motion injects inline <style>, hence style-src 'unsafe-inline'; the
    # JS bundle is same-origin only. HSTS is added at the TLS edge, not here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # The API lives behind the same host (REL-012): first-party cookies flow
        # through the proxy, so the browser sees a single origin.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
